<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>音声認識ディスプレイ</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <div id="stage">
    <div id="subtitle-area"></div>

    <div id="compass">
      <div class="compass-ring"></div>
      <span class="compass-label label-front">前</span>
      <span class="compass-label label-right">右</span>
      <span class="compass-label label-back">後</span>
      <span class="compass-label label-left">左</span>
      <div id="compass-needle"></div>
      <div class="compass-center"></div>
    </div>

    <div id="status-badge">切断中...</div>

    <button id="theme-toggle" title="表示モード切り替え">自動</button>
    <button id="demo-toggle" title="サンプルデータでシミュレーター表示">サンプル表示</button>
  </div>

  <script src="app.js?v=4"></script>
</body>
</html>
